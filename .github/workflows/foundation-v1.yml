name: Dave's Tunes Foundation V1

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: foundation-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: davestunes_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql,mbstring
          coverage: none

      - name: PHP and JavaScript syntax
        run: |
          find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/player.js
          node --check assets/desktop/desktop-core.js
          node --check assets/desktop/template-midnight.js
          node --check assets/desktop/module-player-bridge.js
          node --check assets/desktop/module-library-adapter.js
          node --check assets/desktop/module-object-runtime.js
          node --check assets/desktop/z-scroll-effects.js
          node --check assets/desktop/module-z-scroll.js
          node --check assets/desktop/module-media-objects.js

      - name: Foundation architecture contract
        run: php tests/foundation-v1-contract.php

      - name: Foundation V1 Section 2 catalog contract
        run: php tests/catalog-v110-contract.php

      - name: Foundation V1 Section 4 playback contract
        run: php tests/playback-v130-contract.php

      - name: Music Desktop V1 Section 1 contract
        run: node tests/desktop-v200-contract.mjs

      - name: Music Desktop V1 Section 2 data contract
        run: node tests/desktop-v210-contract.mjs

      - name: Music Desktop V1 Section 3 object contract
        run: node tests/desktop-v220-contract.mjs

      - name: Music Desktop V1 Section 4 Z-Scroll contract
        run: node tests/desktop-v230-contract.mjs

      - name: Music Desktop V1 Section 5 media object contract
        run: node tests/desktop-v240-contract.mjs

      - name: Foundation MySQL integration
        env:
          DAVESTUNES_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=davestunes_test;charset=utf8mb4
          DAVESTUNES_DB_USER: root
          DAVESTUNES_DB_PASS: root
          DAVESTUNES_APP_ENV: test
          DAVESTUNES_APP_KEY: ci-test-key-do-not-use-in-production
        run: php tests/foundation-v1-mysql.php

      - name: Foundation V1 Section 3 library contract
        run: php tests/library-v120-contract.php

      - name: Foundation V1 Section 2 catalog MySQL integration
        env:
          DAVESTUNES_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=davestunes_test;charset=utf8mb4
          DAVESTUNES_DB_USER: root
          DAVESTUNES_DB_PASS: root
          DAVESTUNES_APP_ENV: test
          DAVESTUNES_APP_KEY: ci-test-key-do-not-use-in-production
        run: php tests/catalog-v110-mysql.php

      - name: Foundation V1 Section 3 library MySQL integration
        env:
          DAVESTUNES_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=davestunes_test;charset=utf8mb4
          DAVESTUNES_DB_USER: root
          DAVESTUNES_DB_PASS: root
          DAVESTUNES_APP_ENV: test
          DAVESTUNES_APP_KEY: ci-test-key-do-not-use-in-production
        run: php tests/library-v120-mysql.php

      - name: Foundation V1 Section 4 playback MySQL integration
        env:
          DAVESTUNES_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=davestunes_test;charset=utf8mb4
          DAVESTUNES_DB_USER: root
          DAVESTUNES_DB_PASS: root
          DAVESTUNES_APP_ENV: test
          DAVESTUNES_APP_KEY: ci-test-key-do-not-use-in-production
        run: php tests/playback-v130-mysql.php

      - name: Music Desktop V1 Section 2 data MySQL integration
        env:
          DAVESTUNES_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=davestunes_test;charset=utf8mb4
          DAVESTUNES_DB_USER: root
          DAVESTUNES_DB_PASS: root
          DAVESTUNES_APP_ENV: test
          DAVESTUNES_APP_KEY: ci-test-key-do-not-use-in-production
        run: php tests/desktop-v210-mysql.php

      - name: Music Desktop V1 Section 3 object MySQL integration
        env:
          DAVESTUNES_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=davestunes_test;charset=utf8mb4
          DAVESTUNES_DB_USER: root
          DAVESTUNES_DB_PASS: root
          DAVESTUNES_APP_ENV: test
          DAVESTUNES_APP_KEY: ci-test-key-do-not-use-in-production
        run: php tests/desktop-v220-mysql.php

      - name: Music Desktop V1 Section 5 media object MySQL integration
        env:
          DAVESTUNES_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=davestunes_test;charset=utf8mb4
          DAVESTUNES_DB_USER: root
          DAVESTUNES_DB_PASS: root
          DAVESTUNES_APP_ENV: test
          DAVESTUNES_APP_KEY: ci-test-key-do-not-use-in-production
        run: php tests/desktop-v240-mysql.php
